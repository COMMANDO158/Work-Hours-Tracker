<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Today · FlowFocus</title>
    <meta name="description" content="A visual timer for your contracted hours: 6 a workday, 30 a week.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FlowFocus">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preload" href="assets/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
        // Before first paint: today's gem and the saved appearance, so nothing flashes.
        (function () {
            var gems = ['emerald', 'sapphire', 'amethyst', 'diamond', 'ruby', 'tourmaline', 'topaz'];
            var root = document.documentElement;
            var offset = 0;
            try {
                if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) offset = Number(localStorage.getItem('flowFocusDevOffset')) || 0;
                var prefs = JSON.parse(localStorage.getItem('flowFocusPrefs') || '{}');
                if (prefs.mode === 'light' || prefs.mode === 'dark') root.dataset.mode = prefs.mode;
            } catch (e) { /* storage unavailable */ }
            root.dataset.gem = gems[new Date(Date.now() + offset).getDay()];
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/gems.css">
    <script type="module" src="js/app.js"></script>
</head>
<body data-route="today">
    <a class="skip" href="#main">Skip to content</a>

    <div class="dayband" aria-hidden="true" title="Today so far"><span class="dayband-fill" id="daybandFill"></span></div>

    <header class="shell" id="shell">
        <a class="brand gem-host" href="#/today">
            <span class="brand-gem" id="brandGem"></span>
            <span class="brand-text">
                <span class="brand-name">FlowFocus</span>
                <span class="brand-sub"><span class="long" id="brandLong"></span><span class="short" id="brandShort"></span> · <span class="sync" data-sync-label></span></span>
            </span>
        </a>
        <nav class="nav" aria-label="Screens" data-nav-host="nav-a"></nav>
        <div class="menu-wrap">
            <button class="menu-btn" type="button" aria-expanded="false" aria-controls="shellMenu">Menu</button>
            <div class="menu" id="shellMenu" data-menu hidden></div>
        </div>
    </header>

    <main id="main" tabindex="-1">
        <div class="panes view-today" id="view-today" data-view="today"></div>
        <div class="wrap view-log" id="view-log" data-view="log" hidden></div>
        <div class="wrap view-insights" id="view-insights" data-view="insights" hidden></div>
        <div class="wrap view-settings" id="view-settings" data-view="settings" hidden></div>
    </main>

    <div class="window-banner" id="windowBanner" role="region" aria-label="View-only window" hidden></div>
    <div class="notices" id="notices" aria-live="polite" aria-relevant="additions"></div>

    <noscript><p class="noscript">FlowFocus needs JavaScript to run its timer.</p></noscript>
</body>
</html>
